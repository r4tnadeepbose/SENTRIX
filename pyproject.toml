[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wintermute"
version = "1.3.0"
description = "Layered secret detection from keystroke to cloud: event, scan, alert, remediation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wintermute contributors" }]
keywords = ["security", "secrets", "detection", "devsecops", "dlp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3"]

[project.scripts]
wintermute = "wintermute.cli:main"

[tool.setuptools.packages.find]
include = ["wintermute*"]

[tool.setuptools.package_data]
wintermute = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]