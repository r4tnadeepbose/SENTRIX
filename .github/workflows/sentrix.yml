# SYNTHETIC FIXTURE - fake values for scanner testing only, not real credentials.
name: SENTRIX

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run SENTRIX selftest
        run: python run.py selftest

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate pull request diff against main
        if: github.event_name == 'pull_request'
        run: python run.py gate --base origin/main --head HEAD
      - name: Gate last commit on push (with first-commit fallback)
        if: github.event_name == 'push'
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            python run.py gate --range HEAD~1..HEAD
          else
            # No parent commit: diff against the empty tree object.
            python run.py gate --range 4b825dc642cb6eb9a060e54bf8d69288fbee4904..HEAD
          fi

  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests