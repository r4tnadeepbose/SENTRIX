[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrix"
version = "2.0.0"
description = "SENTRIX - enterprise secret exposure and network threat response intelligence exchange."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SENTRIX contributors" }]
keywords = ["security", "secrets", "detection", "devsecops", "dlp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3"]

[project.scripts]
sentrix = "sentrix.cli:main"

[tool.setuptools.packages.find]
include = ["sentrix*"]

[tool.setuptools.package_data]
sentrix = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]