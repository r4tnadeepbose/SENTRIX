# SENTRIX configuration. Safe defaults; everything works offline.
# Overrides: copy sections into config.local.toml (gitignored).

[server]
host = "127.0.0.1"
port = 8710

[auth]
session_hours = 12
login_rate_limit = 5
# Lock the workspace to the six-person company roster. Disable only for tests
# or bespoke deployments that manage their own account list.
fixed_roster = true
# Demo mode shows sign-in credentials on the login page (loopback only).
# The card disappears as soon as the admin password is changed.
demo_mode = true
demo_password = "sentrix-demo"

[scan]
max_file_bytes = 1_000_000
entropy_threshold = 4.5
fail_on = "high"
ignore_dirs = [
  ".git", "node_modules", "__pycache__", ".venv", "venv",
  "dist", "build", "data", "logs", ".mypy_cache", ".pytest_cache",
  "examples", "tests", "docs", "assets", "sentrix",
]
ignore_files = ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.pdf", "*.ico", "*.lock"]
allowlist_patterns = []

[storage]
path = "data/sentrix.db"

[alerting]
channels = ["console", "outbox"]
slack_webhook = ""
webhook_url = ""
dedupe_window_seconds = 3600
escalate_after_hours = 24
# Findings store -> Jira ticket (outbox draft when Jira is unconfigured).
auto_ticket = true
auto_ticket_min_severity = "critical"

[alerting.quiet_hours]
# start = "22:00"
# end = "07:00"

[detectors]
disabled = []
severity_overrides = {}

# Custom detectors: uncomment and adapt.
# [[custom_detectors]]
# id = "internal-api-key"
# title = "Internal API Key"
# severity = "high"
# pattern = "internal_[A-Za-z0-9]{24,}"

[ai]
enabled = false
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_env = "SENTRIX_AI_KEY"

[surfaces.slack]
token_env = "SENTRIX_SLACK_TOKEN"
channels = []
poll_seconds = 300

[surfaces.confluence]
base_url = ""
token_env = "SENTRIX_CONFLUENCE_TOKEN"

[surfaces.jira]
base_url = ""
token_env = "SENTRIX_JIRA_TOKEN"
project = "SEC"

[surfaces.postman]
api_key_env = "SENTRIX_POSTMAN_KEY"
workspaces = []

[surfaces.cloud]
provider = "local"
lambda_dir = "examples/lambda"
# --- Advanced features (additive) ---
[features.github]
token_env = "SENTRIX_GITHUB_TOKEN"
webhook_secret_env = "SENTRIX_GITHUB_WEBHOOK_SECRET"
api_base = "https://api.github.com"

[features.github_webhooks]
enabled = true

[features.github_pr_scanner]
enabled = true

[features.github_push_scanner]
enabled = true

[features.github_actions_gate]
enabled = true

[features.full_repo_rescan]
enabled = true
paths = []
interval_seconds = 86400

[features.aws_lambda_monitoring]
enabled = true

[features.aws_multi_account]
enabled = true
accounts = []

[features.lambda_env_scan]
enabled = true

[features.lambda_zip_scan]
enabled = true

[features.realtime_slack_monitoring]
enabled = true

[features.slack_private_consent]
enabled = false
allowed_channels = []

[features.realtime_jira_monitoring]
enabled = true

[features.realtime_confluence_monitoring]
enabled = true

[features.postman_monitoring]
enabled = true
export_paths = []

[features.secret_validation]
enabled = false
github_api = false

[features.s3_audit_archival]
enabled = false
bucket = ""
prefix = "sentrix/audit/"
interval_seconds = 3600

[features.missed_webhook_detection]
enabled = true

[features.integration_health_monitoring]
enabled = true

[features.realtime_monitoring]
interval_seconds = 300

[features.jira_webhook]
enabled = true
secret_env = "SENTRIX_JIRA_WEBHOOK_SECRET"

[features.confluence_webhook]
enabled = true
secret_env = "SENTRIX_CONFLUENCE_WEBHOOK_SECRET"

[features.aws_deployment_webhook]
enabled = true
token_env = "SENTRIX_AWS_WEBHOOK_TOKEN"
