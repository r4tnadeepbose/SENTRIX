<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="KeySentry console - layered secret detection across editor, git, CI, cloud and collaboration surfaces.">
<title>KeySentry Console</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<noscript><p class="noscript">The KeySentry console requires JavaScript.</p></noscript>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="/logo.svg" alt="KeySentry logo">
    <span class="brand-name">KeySentry</span>
    <span class="brand-sub">Secret detection console</span>
  </div>
  <div class="topbar-right">
    <span class="live" id="live" role="status" aria-label="Server status: connecting">
      <span class="live-dot" aria-hidden="true"></span><span id="live-label">Connecting</span>
    </span>
    <button class="palette-hint" id="palette-open" type="button" aria-label="Open command palette">
      Actions <kbd>Ctrl K</kbd>
    </button>
    <div class="usermenu-wrap">
      <button class="usermenu-btn" id="usermenu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="User menu">
        <span class="avatar" id="user-initial" aria-hidden="true"></span>
        <span id="user-name"></span>
        <span class="role-chip" id="user-role"></span>
        <svg class="caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5l3.5 3.5 3.5-3.5"/></svg>
      </button>
      <div class="menu" id="usermenu" role="menu" aria-label="User menu" hidden>
        <div class="menu-head">
          <div class="menu-user" id="menu-user"></div>
          <div class="menu-role" id="menu-role"></div>
        </div>
        <button type="button" role="menuitem" id="menu-password">Change password</button>
        <button type="button" role="menuitem" id="menu-signout">Sign out</button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Primary navigation">
    <a class="nav-link" href="#/overview" data-nav="overview">
      <svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1"/><rect x="11.5" y="2.5" width="6" height="6" rx="1"/><rect x="2.5" y="11.5" width="6" height="6" rx="1"/><rect x="11.5" y="11.5" width="6" height="6" rx="1"/></svg>
      Overview <span class="nav-key">g o</span>
    </a>
    <a class="nav-link" href="#/findings" data-nav="findings">
      <svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.8 12.8l4.7 4.7"/></svg>
      Findings <span class="nav-key">g f</span>
    </a>
    <a class="nav-link" href="#/playground" data-nav="playground">
      <svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3.5" width="16" height="13" rx="1.5"/><path d="M5.5 8l2.5 2-2.5 2M10.5 12h4"/></svg>
      Playground <span class="nav-key">g p</span>
    </a>
    <a class="nav-link" href="#/jobs" data-nav="jobs">
      <svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l7.5 4-7.5 4-7.5-4z"/><path d="M2.5 10.5l7.5 4 7.5-4"/><path d="M2.5 14.5l7.5 4 7.5-4"/></svg>
      Jobs <span class="nav-key">g j</span>
    </a>
    <a class="nav-link" href="#/activity" data-nav="activity">
      <svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10h4l2.5-6 3.5 12 2.5-6H18"/></svg>
      Activity <span class="nav-key">g a</span>
    </a>
    <a class="nav-link" href="#/logs" data-nav="logs">
      <svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12M4 8h12M4 11.5h8M4 15h10"/></svg>
      Logs <span class="nav-key">g l</span>
    </a>
    <a class="nav-link" href="#/allowlist" data-nav="allowlist">
      <svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l6.5 2.8v4.7c0 4.2-2.8 7.2-6.5 8.5-3.7-1.3-6.5-4.3-6.5-8.5V4.8z"/><path d="M7 10l2.2 2.2L13.5 8"/></svg>
      Allowlist <span class="nav-key">g w</span>
    </a>
    <a class="nav-link" href="#/settings" data-nav="settings">
      <svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/><circle cx="7.5" cy="5.5" r="1.8"/><circle cx="12.5" cy="10" r="1.8"/><circle cx="6.5" cy="14.5" r="1.8"/></svg>
      Settings <span class="nav-key">g s</span>
    </a>
    <div class="sidebar-foot" id="sidebar-version">KeySentry</div>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <div id="view" aria-busy="true"></div>
  </main>
</div>

<nav class="tabbar" aria-label="Primary navigation (mobile)">
  <a href="#/overview" data-nav="overview" aria-label="Overview"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1"/><rect x="11.5" y="2.5" width="6" height="6" rx="1"/><rect x="2.5" y="11.5" width="6" height="6" rx="1"/><rect x="11.5" y="11.5" width="6" height="6" rx="1"/></svg>Overview</a>
  <a href="#/findings" data-nav="findings" aria-label="Findings"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.8 12.8l4.7 4.7"/></svg>Findings</a>
  <a href="#/playground" data-nav="playground" aria-label="Playground"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3.5" width="16" height="13" rx="1.5"/><path d="M5.5 8l2.5 2-2.5 2M10.5 12h4"/></svg>Play</a>
  <a href="#/jobs" data-nav="jobs" aria-label="Jobs"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l7.5 4-7.5 4-7.5-4z"/><path d="M2.5 10.5l7.5 4 7.5-4"/><path d="M2.5 14.5l7.5 4 7.5-4"/></svg>Jobs</a>
  <a href="#/activity" data-nav="activity" aria-label="Activity"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10h4l2.5-6 3.5 12 2.5-6H18"/></svg>Activity</a>
  <a href="#/logs" data-nav="logs" aria-label="Logs"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12M4 8h12M4 11.5h8M4 15h10"/></svg>Logs</a>
  <a href="#/allowlist" data-nav="allowlist" aria-label="Allowlist"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l6.5 2.8v4.7c0 4.2-2.8 7.2-6.5 8.5-3.7-1.3-6.5-4.3-6.5-8.5V4.8z"/><path d="M7 10l2.2 2.2L13.5 8"/></svg>Allow</a>
  <a href="#/settings" data-nav="settings" aria-label="Settings"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/><circle cx="7.5" cy="5.5" r="1.8"/><circle cx="12.5" cy="10" r="1.8"/><circle cx="6.5" cy="14.5" r="1.8"/></svg>Settings</a>
</nav>

<div id="drawer-root"></div>
<div id="popover-root"></div>
<div id="palette-root"></div>
<div id="dialog-root"></div>
<div id="toast-root" aria-live="polite" aria-label="Notifications"></div>

<script src="/static/app.js"></script>
</body>
</html>
