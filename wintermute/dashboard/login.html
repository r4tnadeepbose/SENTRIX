<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Wintermute</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #0f1113; --panel: #15181b; --border: #262b30;
    --text: #d3d7da; --muted: #879096; --accent: #aeb6bd;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 32px 28px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand img { width: 36px; height: 36px; }
  .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; background: #101315; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 10px; font: inherit; outline: none;
  }
  input:focus { border-color: #3a4147; }
  button {
    width: 100%; margin-top: 22px; padding: 10px; cursor: pointer;
    background: #23282c; color: var(--text); border: 1px solid #31373c;
    border-radius: 6px; font: 600 13.5px system-ui, sans-serif;
  }
  button:hover { background: #2a3035; }
  button:disabled { opacity: .6; cursor: default; }
  .error { display: none; margin-top: 14px; color: #d76a5e; font-size: 12.5px; }
  .note { margin-top: 18px; color: var(--muted); font-size: 11.5px; }
  .note code { font-family: ui-monospace, monospace; color: var(--accent); }
  .demo {
    display: none; margin-top: 20px; padding: 12px;
    background: #101315; border: 1px dashed #31373c; border-radius: 6px;
  }
  .demo-title { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .demo-creds { font-family: ui-monospace, monospace; font-size: 12.5px; margin: 8px 0; color: var(--accent); }
  .demo button { margin-top: 4px; padding: 8px; font-size: 12.5px; }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="brand">
      <img src="/logo.svg" alt="">
      <h1>Wintermute</h1>
    </div>
    <p class="sub">Sign in to the detection console</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Sign in</button>
    <p class="error" id="error" role="alert"></p>
    <div class="demo" id="demo">
      <div class="demo-title">Demo access</div>
      <div class="demo-creds" id="demo-creds"></div>
      <button id="demo-login" type="button">Sign in with demo account</button>
    </div>
    <p class="note">Demo credentials are shown only while the admin password is
      unchanged and the server listens on localhost. Change it in Settings after signing in.</p>
  </form>
<script>
  const form = document.getElementById("form");
  const error = document.getElementById("error");
  const submit = document.getElementById("submit");
  fetch("/api/auth/demo-info").then((r) => r.json()).then((info) => {
    if (!info.enabled) return;
    document.getElementById("demo").style.display = "block";
    document.getElementById("demo-creds").textContent =
      "username: " + info.username + "  /  password: " + info.password;
    document.getElementById("demo-login").addEventListener("click", () => {
      document.getElementById("username").value = info.username;
      document.getElementById("password").value = info.password;
      form.requestSubmit();
    });
  }).catch(() => {});
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.style.display = "none";
    submit.disabled = true;
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Sign-in failed.");
      location.href = "/";
    } catch (err) {
      error.textContent = err.message;
      error.style.display = "block";
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
