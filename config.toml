# SENTRIX configuration. Safe defaults; everything works offline.
# Overrides: copy sections into config.local.toml (gitignored).

[server]
host = "127.0.0.1"
port = 8710

[auth]
session_hours = 12
login_rate_limit = 5
# Demo mode shows sign-in credentials on the login page (loopback only).
# The card disappears as soon as the admin password is changed.
demo_mode = true
demo_password = "sentrix-demo"

[scan]
max_file_bytes = 1_000_000
entropy_threshold = 4.5
fail_on = "high"
ignore_dirs = [
  ".git", "node_modules", "__pycache__", ".venv", "venv",
  "dist", "build", "data", "logs", ".mypy_cache", ".pytest_cache",
  "examples", "tests", "docs", "assets", "sentrix",
]
ignore_files = ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.pdf", "*.ico", "*.lock"]
allowlist_patterns = []

[storage]
path = "data/sentrix.db"

[alerting]
channels = ["console", "outbox"]
slack_webhook = ""
webhook_url = ""
dedupe_window_seconds = 3600
escalate_after_hours = 24
# Findings store -> Jira ticket (outbox draft when Jira is unconfigured).
auto_ticket = true
auto_ticket_min_severity = "critical"

[alerting.quiet_hours]
# start = "22:00"
# end = "07:00"

[detectors]
disabled = []
severity_overrides = {}

# Custom detectors: uncomment and adapt.
# [[custom_detectors]]
# id = "internal-api-key"
# title = "Internal API Key"
# severity = "high"
# pattern = "internal_[A-Za-z0-9]{24,}"

[ai]
enabled = false
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_env = "SENTRIX_AI_KEY"

[surfaces.slack]
token_env = "SENTRIX_SLACK_TOKEN"
channels = []
poll_seconds = 300

[surfaces.confluence]
base_url = ""
token_env = "SENTRIX_CONFLUENCE_TOKEN"

[surfaces.jira]
base_url = ""
token_env = "SENTRIX_JIRA_TOKEN"
project = "SEC"

[surfaces.postman]
api_key_env = "SENTRIX_POSTMAN_KEY"
workspaces = []

[surfaces.cloud]
provider = "local"
lambda_dir = "examples/lambda"